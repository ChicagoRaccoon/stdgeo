[package]
name = "stdgeo"
version = "0.1.0"
edition = "2021"

[lib]
name = "stdgeo"
crate-type = ["cdylib", "rlib"]

# Primary headless binary
[[bin]]
name = "stdgeo"
path = "src/bin/stdgeo.rs"

# Test binary (keep existing)
[[bin]]
name = "stdgeo_test"
path = "src/main.rs"

[dependencies]
libc = "0.2"
atty = "0.2"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
