[package]
name = "stdgeo-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stdgeo-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
stdgeo = { path = "../stdgeo" }
stdgeo-parser = { path = "../stdgeo-parser" }
anyhow = "1.0"
rustyline = "13.0"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.0"